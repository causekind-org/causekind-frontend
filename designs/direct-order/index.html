<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CauseKind — Direct delivery design preview</title>
  <style>
    :root{color-scheme:light;--accent:#b64e22;--soft:#fff0e6;--ink:#282421;--muted:#756f69;--line:#e9e3dc;--paper:#faf8f5;--green:#237454}
    *{box-sizing:border-box}body{margin:0;background:#eeeae5;color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}button,a{touch-action:manipulation}button{transition:background-color .18s,color .18s,transform .18s}button:active:not(:disabled){transform:scale(.96)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}a{color:var(--accent)}h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance}p{text-wrap:pretty}svg{width:21px;height:21px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .preview{max-width:1200px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;color:#665e56;font-size:12px}.preview strong{color:#332d27}.preview button{border:1px solid #d2c9bf;background:transparent;border-radius:8px;min-height:40px;padding:0 14px}.preview-tools{display:flex;gap:8px}
    .shell{max-width:1440px;margin:0 auto;background:var(--paper);min-height:calc(100svh - 72px);box-shadow:0 10px 50px #25180b0a}.shell[data-role=donee]{--accent:#203e63;--soft:#eaf0f7;--ink:#202d3d}.shell.mobile{max-width:390px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 5%;border-bottom:1px solid var(--line);background:#fffdfb}.brand{font-weight:850;font-size:23px;letter-spacing:-1px;color:#342b25}.brand span{color:#c66436}.role{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--muted)}.avatar{display:grid;place-items:center;background:var(--soft);color:var(--accent);width:34px;height:34px;border-radius:50%;font-weight:800}
    .screen-nav{padding:15px 5%;display:flex;gap:8px;overflow:auto;border-bottom:1px solid var(--line);background:#fffdfb;scrollbar-width:thin}.screen-nav button{background:transparent;border:1px solid transparent;white-space:nowrap;padding:8px 14px;min-height:40px;border-radius:24px;color:var(--muted);font-size:12px;font-weight:600}.screen-nav button[aria-current=step]{color:var(--accent);border-color:var(--accent);background:var(--soft)}.screen-nav b{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:6px;border-radius:50%;background:#eae5de;font-size:10px}.screen-nav button[aria-current=step] b{background:var(--accent);color:white}
    .content{max-width:1120px;margin:auto;padding:42px 28px 56px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.6px;margin-bottom:10px}.heading-row{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}h1{font:normal clamp(28px,3.6vw,40px)/1.15 Georgia,serif;letter-spacing:-.7px;margin-bottom:12px}.intro{color:var(--muted);max-width:570px;font-size:14px}.badge{display:inline-flex;align-items:center;gap:7px;background:var(--soft);color:var(--accent);padding:7px 11px;border-radius:6px;font-size:11px;font-weight:750;white-space:nowrap}.badge.green{background:#eaf5ee;color:var(--green)}.badge svg{width:15px;height:15px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 305px;gap:28px;align-items:start}.stack{display:grid;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:25px;box-shadow:0 2px 3px #30231203,0 12px 32px -24px #30231230}.card h2{font-size:16px;line-height:1.3;margin-bottom:8px;letter-spacing:-.3px}.sub{font-size:12px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.section-head h2{margin:0}.section-icon{display:flex;align-items:center;gap:9px}.section-icon svg{color:var(--accent)}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:7px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:650}.field label span{font-weight:400;color:var(--muted)}.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid #ddd8d2;border-radius:8px;padding:11px 12px;background:#fff;color:var(--ink);font-size:14px}.field textarea{resize:vertical;min-height:80px}.field input::placeholder,.field textarea::placeholder{color:#928b83;font-size:12px}.field small{font-size:11px;color:var(--muted)}
    .choice{display:flex;align-items:start;gap:12px;padding:17px;border:1px solid var(--accent);border-radius:10px;background:var(--soft)}.choice .tile{background:white;border-radius:9px;width:38px;height:38px;display:grid;place-items:center;color:var(--accent);flex:none}.choice strong{font-size:13px;display:block}.choice p{font-size:12px;color:var(--muted);margin-top:3px}.radio-mark{margin-left:auto;background:var(--accent);border:4px solid #fff;outline:1px solid var(--accent);width:15px;height:15px;border-radius:50%;flex:none;margin-top:4px}.inline-note{display:flex;align-items:start;gap:9px;font-size:12px;color:var(--muted);margin-top:15px}.inline-note svg{width:16px;height:16px;margin-top:2px;color:var(--accent)}
    .actions{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:20px;margin-top:24px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;border-radius:9px;padding:11px 20px;border:1px solid var(--accent);background:var(--accent);color:white;font-weight:700;font-size:13px;text-decoration:none}.btn svg{width:17px;height:17px}.btn.secondary{background:white;border-color:#ded7ce;color:var(--ink)}.text-btn{background:transparent;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:6px 0;font-size:12px}.wide{width:100%}.fine{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}.aside{position:sticky;top:24px}.request-art{display:grid;place-items:center;background:#f1eee7;border-radius:11px;height:137px;margin-bottom:20px}.bag{width:95px;height:112px;color:#826a4e;stroke-width:1.5}.label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;font-weight:750;color:var(--muted);margin-bottom:8px}.request-title{font:22px/1.25 Georgia,serif!important;margin-bottom:8px!important}.meta{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:17px}.meta svg{width:15px;height:15px}.specs{list-style:none;margin:0;padding:15px 0;border-top:1px solid var(--line);display:grid;gap:8px;color:#615a53;font-size:12px}.specs li{display:flex;gap:8px}.specs svg{width:15px;height:15px;color:var(--green);margin-top:2px}.assurance{padding:20px 8px;display:flex;align-items:start;gap:10px;color:var(--muted);font-size:12px}.assurance svg{color:var(--accent)}.assurance strong{display:block;color:var(--ink);margin-bottom:4px;font-size:12px}
    .callout{display:flex;align-items:start;gap:12px;padding:17px 18px;border-radius:10px;background:var(--soft);font-size:12px;color:var(--accent)}.callout strong{display:block;margin-bottom:3px}.offer-summary{display:flex;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:20px}.small-art{width:62px;height:68px;background:#f1eee7;border-radius:9px;display:grid;place-items:center;flex:none}.small-art svg{width:39px;height:49px;color:#826a4e}.offer-summary strong{display:block;font-size:14px;margin-bottom:4px}.offer-summary p{color:var(--muted);font-size:12px}.address{background:#f7f8fa;border:1px solid #e3e8ef;border-radius:10px;padding:18px;margin:18px 0;line-height:1.8}.address strong{display:block;font-size:14px}.address p{font-size:13px}.address .hint{font-size:11px;color:var(--muted);margin-top:9px}.consent{display:flex;align-items:start;gap:11px;cursor:pointer;font-size:12px;line-height:1.7;padding:5px 0}.consent input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:3px 0 0}.address-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.lockbox{display:flex;align-items:center;gap:16px;border:1px dashed #d8cfc5;border-radius:12px;padding:23px 18px;background:#faf8f5}.lockbox svg{color:var(--muted);width:28px;height:28px}.lockbox strong{display:block;font-size:13px}.lockbox p{font-size:12px;color:var(--muted);margin-top:5px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:22px 0}.facts dt{font-size:11px;color:var(--muted);margin-bottom:3px}.facts dd{margin:0;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}.upload{display:flex;align-items:center;gap:12px;position:relative;padding:20px;border:1px dashed #cfc6bb;border-radius:10px;background:#fdfbf8;cursor:pointer;font-size:12px;min-height:80px}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}.upload:focus-within{outline:3px solid var(--accent);outline-offset:3px}.upload svg{color:var(--accent)}.upload strong{display:block}.upload span{color:var(--muted);font-size:11px}.timeline{list-style:none;padding:0;margin:22px 0 0}.timeline li{position:relative;display:flex;gap:14px;padding-bottom:25px}.timeline li:not(:last-child):before{content:"";position:absolute;left:11px;top:27px;bottom:4px;border-left:1px solid #ded8d1}.dot{width:24px;height:24px;display:grid;place-items:center;background:#edf5ee;color:var(--green);border-radius:50%;flex:none}.dot svg{width:13px;height:13px}.dot.pending{background:var(--soft);color:var(--accent)}.timeline strong{display:block;font-size:13px}.timeline p{font-size:12px;color:var(--muted);margin-top:3px}.success{padding:35px 25px;text-align:center}.success-mark{margin:0 auto 18px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:var(--green);background:#edf5ee}.success-mark svg{width:30px;height:30px}.success h2{font:30px Georgia,serif;margin-bottom:12px}.success p{color:var(--muted);max-width:410px;margin:0 auto 22px}.issue{border-top:1px solid var(--line);margin-top:24px;padding-top:15px;text-align:center}.footer{padding:22px;text-align:center;color:#8b8379;font-size:11px}.notice{font-size:12px;margin:12px 0;color:var(--green)}dialog{border:1px solid var(--line);padding:25px;border-radius:16px;width:min(440px,calc(100% - 32px));color:var(--ink);box-shadow:0 20px 70px #0002}dialog::backdrop{background:#231e1966}dialog h2{margin-bottom:10px;font-size:20px}dialog p{font-size:13px;color:var(--muted);margin-bottom:18px}dialog .field{margin-bottom:15px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}
    @media(max-width:740px){.preview{padding:10px 14px;align-items:start}.preview-tools #size-toggle{display:none}.preview small{display:block}.topbar{padding:15px 20px}.brand{font-size:21px}.screen-nav{padding:10px 14px}.content{padding:26px 18px 35px}.heading-row{align-items:start;flex-direction:column;gap:10px;margin-bottom:22px}.layout{grid-template-columns:1fr;gap:20px}.aside{position:static;grid-row:1}.aside .card{padding:16px;display:grid;grid-template-columns:62px minmax(0,1fr);column-gap:13px}.request-art{height:74px;margin:0;grid-row:1/5}.request-art svg{width:45px;height:59px}.aside .request-title{font:17px/1.3 Georgia,serif!important}.aside .label{font-size:9px}.aside .meta{margin-bottom:0}.aside .specs{grid-column:1/-1;margin-top:13px;padding:12px 0 0;gap:5px}.assurance{display:none}.card{padding:20px}.field-grid{gap:15px}.field input,.field textarea,.field select{font-size:16px}.actions{align-items:stretch;flex-direction:column-reverse}.actions .btn{width:100%}.actions .text-btn{text-align:center}.intro{font-size:13px}.role{font-size:11px}.heading-row>.badge{font-size:10px}h1{font-size:31px}.facts{gap:12px}.preview strong{font-size:11px}.preview button{font-size:11px;padding:0 10px}.footer{padding-bottom:28px}}
    .mobile .topbar{padding:15px 20px}.mobile .content{padding:26px 18px 35px}.mobile .layout{grid-template-columns:1fr}.mobile .aside{position:static;grid-row:1}.mobile .aside .request-art,.mobile .aside .specs,.mobile .assurance{display:none}.mobile .aside .card{padding:16px}.mobile .request-title{font-size:18px!important}.mobile .heading-row{flex-direction:column;align-items:start;gap:12px}.mobile h1{font-size:31px}.mobile .card{padding:20px}.mobile .actions{flex-direction:column-reverse;align-items:stretch}.mobile .field-grid{grid-template-columns:1fr}.mobile .field input,.mobile .field textarea,.mobile .field select{font-size:16px}
    @media(max-width:390px){.field-grid{grid-template-columns:1fr}.content{padding-inline:14px}.card{padding:17px}.facts{grid-template-columns:1fr}.role>span{display:none}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}button:active:not(:disabled){transform:none}}
  </style>
</head>
<body>
  <div class="preview"><div><strong>DIRECT DELIVERY · DESIGN PREVIEW</strong><small> &nbsp; Fictional sample data. Nothing is sent or saved.</small></div><div class="preview-tools"><button id="size-toggle" aria-pressed="false">Mobile view</button><button id="reset">Reset</button></div></div>
  <div class="shell" id="shell" data-role="donor">
    <header class="topbar"><div class="brand">Cause<span>Kind</span></div><div class="role"><span id="role-label">Donor view</span><div class="avatar" id="avatar">D</div></div></header>
    <nav class="screen-nav" aria-label="Preview screens" id="screen-nav"></nav>
    <main class="content" id="content"></main>
    <footer class="footer">A thoughtful purchase. A real difference.</footer>
  </div>
  <dialog id="message-dialog" aria-labelledby="dialog-title"><form id="message-form"><h2 id="dialog-title">Ask for a change</h2><p id="dialog-intro">Let the donor know what would work better.</p><div class="field"><label for="message">Your message</label><textarea id="message" required maxlength="500" placeholder="For example, could you choose the larger size?"></textarea></div><div class="actions"><button type="button" class="text-btn" id="close-dialog">Cancel</button><button class="btn" type="submit">Send message</button></div></form></dialog>
  <script>
    const paths={arrow:'M5 12h14m-6-6 6 6-6 6',check:'m5 12 4 4L19 6',shield:'M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6l-8-3Zm-4 9 3 3 5-6',lock:'M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5zM12 14v3',truck:'M3 5h11v12H3zM14 9h4l3 4v4h-7M5 17a2 2 0 1 0 4 0M16 17a2 2 0 1 0 4 0',pin:'M19 10c0 6-7 11-7 11S5 16 5 10a7 7 0 1 1 14 0ZM12 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6',bag:'M5 7h14l1 14H4L5 7ZM8 8V6a4 4 0 0 1 8 0v2',file:'M14 3H5v18h14V8l-5-5Zm0 0v6h5M8 13h8M8 17h6',copy:'M8 8h12v13H8zM16 8V3H3v13h5',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 4v5l3 2',heart:'M20 5c-3-3-6-1-8 1-2-2-5-4-8-1-5 5 2 10 8 15 6-5 13-10 8-15',upload:'M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6'};
    const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.check}"/></svg>`;
    const bag=()=>'<svg class="bag" viewBox="0 0 100 120" aria-hidden="true"><path d="M35 28v-8c0-17 30-17 30 0v8"/><rect x="19" y="25" width="62" height="82" rx="22" fill="#dfd3be"/><path d="M19 52h62M28 51v-8M76 61h8v35h-8M24 61h-8v35h8"/><rect x="29" y="67" width="42" height="29" rx="8" fill="#f7f3eb"/><path d="M33 74h34M64 74v7M37 37h26"/><rect x="42" y="37" width="16" height="8" rx="2" fill="#f7f3eb"/></svg>';
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fresh=()=>({screen:0,sent:false,accepted:false,ordered:false,received:false,consent:false,editing:false,deliveryOkay:false,item:'Everyday school backpack, 28 L',link:'',timeline:'Within 3 days of acceptance',notes:'A navy blue bag with padded straps and two compartments.',name:'Sample recipient',phone:'9000000000',line:'Flat 4, Example Apartments',area:'Example Road, Sample Nagar',city:'Pune',state:'Maharashtra',pin:'411001',store:'Amazon',order:'',date:'',tracking:'',attachment:'',notice:''});let state=fresh();
    const labels=['Purchase offer','Confirm address','Place order','Track delivery','Confirm receipt'];
    function aside(){return `<aside class="aside"><section class="card" aria-label="Original request"><div class="request-art">${bag()}</div><p class="label">The need you’re helping with</p><h2 class="request-title">A school bag for a fresh start</h2><div class="meta">${icon('pin')}Pune, Maharashtra · 1 item</div><ul class="specs"><li>${icon('check')}25–30 litre capacity</li><li>${icon('check')}Two compartments & padded straps</li><li>${icon('check')}Navy, grey or black</li></ul></section><div class="assurance">${icon('shield')}<div><strong>A little care goes a long way</strong>Confirm the item first. Purchase only after the recipient accepts.</div></div></aside>`;}
    function summary(){return `<div class="offer-summary"><div class="small-art">${bag()}</div><div><strong>${esc(state.item)}</strong><p>1 new item · Retailer delivery</p><p>${esc(state.timeline)}</p></div></div>`;}
    function locked(){return `<div class="lockbox">${icon('lock')}<div><strong>Delivery details are private</strong><p>The recipient’s address appears here only after they accept and agree to share it.</p></div></div>`;}
    function address(){return `<div class="address"><strong>${esc(state.name)}</strong><p>${esc(state.line)}<br>${esc(state.area)}<br>${esc(state.city)}, ${esc(state.state)} — ${esc(state.pin)}</p><p>Phone: ${esc(state.phone)}</p><p class="hint">Fictional address for this preview.</p></div>`;}
    function heading(eyebrow,title,intro,badge){return `<div class="heading-row"><div><p class="eyebrow">${eyebrow}</p><h1 id="screen-heading" tabindex="-1">${title}</h1><p class="intro">${intro}</p></div>${badge?`<span class="badge">${icon('shield')}${badge}</span>`:''}</div>`;}
    function field(label,name,value,options=''){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" value="${esc(value)}" ${options}></div>`;}
    function donorOffer(){if(state.sent)return heading('YOUR PURCHASE OFFER',state.accepted?'Your offer is accepted.':'A promise worth waiting for.',state.accepted?'The recipient has confirmed their delivery details. You can now place the order.':'Your proposed item is ready for the recipient to review. Please wait for acceptance before buying.')+`<div class="layout"><div class="stack"><section class="card">${summary()}<div class="callout">${icon(state.accepted?'check':'clock')}<div><strong>${state.accepted?'Ready to order':'Waiting for the recipient'}</strong>${state.accepted?'Their address is available in the order step.':'They’ll confirm the item and a delivery address before you order.'}</div></div><div style="margin-top:20px">${state.accepted?'<p class="sub">Shared for this donation only.</p>':locked()}</div><div class="actions"><button class="text-btn" data-action="edit-offer" ${state.accepted?'disabled':''}>Edit proposal</button><button class="btn" data-go="${state.accepted?2:1}">${state.accepted?'Continue to order':'Preview recipient’s next step'}${icon('arrow')}</button></div></section></div>${aside()}</div>`;
      return heading('GIVE SOMETHING NEW','A new item. A thoughtful gesture.','Choose what you’ll buy. We’ll ask the recipient to confirm before you spend anything.','Buy after acceptance')+`<div class="layout"><form class="card" id="proposal-form"><div class="section-head"><h2>What are you planning to buy?</h2><span class="sub">Step 1 of 3</span></div><div class="field-grid"><div class="field full"><label for="item">Item name</label><input id="item" name="item" required maxlength="140" value="${esc(state.item)}"></div><div class="field full"><label for="link">Product link <span>· optional</span></label><input id="link" name="link" type="url" placeholder="Paste a link from Amazon or another shop" value="${esc(state.link)}"><small>A product link helps the recipient check the size and specifications.</small></div><div class="field full"><label for="timeline">When will you place the order?</label><select name="timeline" id="timeline">${['Within 3 days of acceptance','Within 7 days of acceptance','Within 14 days of acceptance'].map(t=>`<option ${t===state.timeline?'selected':''}>${t}</option>`).join('')}</select></div><div class="field full"><label for="notes">A note about your choice <span>· optional</span></label><textarea id="notes" name="notes" maxlength="500">${esc(state.notes)}</textarea></div></div><h2 style="margin:26px 0 13px">How will it reach them?</h2><div class="choice"><div class="tile">${icon('truck')}</div><div><strong>Order directly to the recipient</strong><p>Buy on a retailer’s website and use their confirmed delivery address.</p></div><span class="radio-mark" aria-hidden="true"></span></div><p class="inline-note">${icon('lock')}Their address stays private until they accept your offer and confirm sharing.</p><div class="actions"><span class="sub">You won’t be charged by CauseKind.</span><button class="btn" type="submit">Send purchase offer${icon('arrow')}</button></div></form>${aside()}</div>`;}
    function doneeAddress(){return heading('SOMEONE WANTS TO HELP','A new bag, just for your request.','Review the proposed item, then confirm where it should be delivered.','Donee view')+`<div class="layout"><div class="stack"><section class="card"><div class="section-head"><h2>Your purchase offer</h2><span class="badge green">${icon('bag')}New item</span></div>${summary()}<p class="sub">${esc(state.notes)||'The donor will buy this item after you accept.'}</p>${state.link?`<a class="text-btn" href="${esc(state.link)}" target="_blank" rel="noopener noreferrer">View proposed product ↗</a>`:''}</section><form class="card" id="address-form"><div class="address-head"><div class="section-icon">${icon('pin')}<h2>Confirm your delivery address</h2></div><button type="button" class="text-btn" data-action="edit-address">${state.editing?'Cancel edit':'Edit'}</button></div><p class="sub" style="margin-top:7px">Prefilled from your profile. Change it if you’ll receive this parcel somewhere else.</p>${state.editing?`<div class="field-grid" style="margin:20px 0">${field('Recipient name','name',state.name,'required autocomplete="name" maxlength="80"')}${field('Contact number','phone',state.phone,'required type="tel" autocomplete="tel" pattern="[+0-9 ()-]{7,20}"')}${field('Flat / building','line',state.line,'required autocomplete="address-line1" maxlength="140"')}${field('Street / area','area',state.area,'required autocomplete="address-line2" maxlength="140"')}${field('City','city',state.city,'required autocomplete="address-level2"')}${field('State','state',state.state,'required autocomplete="address-level1"')}${field('PIN code','pin',state.pin,'required inputmode="numeric" pattern="[1-9][0-9]{5}" autocomplete="postal-code"')}</div>`:address()}<label class="consent"><input type="checkbox" id="consent" required ${state.consent?'checked':''}><span>I confirm this address and agree to share my name, phone number and delivery address with this donor so they can place my order with the retailer or courier.</span></label><div class="actions"><button type="button" class="text-btn" data-action="change">Ask for a change</button><button class="btn" id="accept" type="submit" ${state.consent?'':'disabled'}>Accept & share address${icon('arrow')}</button></div><p class="fine">Your address will not appear on the public request.</p></form></div>${aside()}</div>`;}
    function placeOrder(){if(!state.accepted)return heading('DELIVERY DETAILS','Wait for the recipient’s confirmation.','You can place the order once your offer and delivery address are confirmed.')+`<div class="layout"><section class="card">${locked()}<div class="actions"><span class="sub">No address has been shared.</span><button class="btn" data-go="1">Preview address confirmation${icon('arrow')}</button></div></section>${aside()}</div>`;return heading('YOUR OFFER WAS ACCEPTED','You can place the order now.','Use the confirmed details below at checkout on your chosen retailer’s website.','Address shared with you')+`<div class="layout"><div class="stack"><section class="card"><div class="address-head"><div class="section-icon">${icon('pin')}<h2>Deliver to</h2></div><button class="text-btn" data-action="copy">${icon('copy')} Copy details</button></div>${address()}<p class="inline-note">${icon('lock')}Use these details only for this donation. Choose a prepaid order so the recipient has nothing to pay.</p><p class="notice" id="copy-status" role="status"></p></section><form class="card" id="order-form"><div class="section-head"><h2>Already placed the order?</h2><span class="badge green">${icon('check')}Offer accepted</span></div><p class="sub" style="margin-bottom:20px">Add the confirmation so the recipient knows what to expect.</p><div class="field-grid">${field('Retailer','store',state.store,'required maxlength="80"')}${field('Order reference','order',state.order,'required placeholder="Your order number" maxlength="80"')}${field('Expected delivery','date',state.date,'required type="date"')}${field('Tracking link · optional','tracking',state.tracking,'type="url" placeholder="https://…"')}<div class="field full"><label for="proof">Order confirmation</label><label class="upload" for="proof">${icon('upload')}<div><strong id="file-label">${esc(state.attachment)||'Choose a screenshot or PDF'}</strong><span>Preview only · file is not uploaded</span></div><input id="proof" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" ${state.attachment?'':'required'}></label><small>Hide payment details and unrelated purchases before sharing.</small></div></div><div class="actions"><span class="sub">Buy on the retailer’s website first.</span><button class="btn" type="submit">Share order update${icon('arrow')}</button></div></form></div>${aside()}</div>`;}
    function tracking(){return heading('YOUR DONATION JOURNEY',state.ordered?'A little closer to a fresh start.':'Your order update will appear here.',state.ordered?'The recipient can see the delivery estimate. Your donation stays open until they confirm receipt.':'Share an order confirmation after you’ve placed the purchase.')+`<div class="layout"><section class="card">${summary()}<div class="callout">${icon('truck')}<div><strong>${state.ordered?'Order placed · awaiting delivery':'No order confirmed yet'}</strong>${state.date?'Expected '+esc(new Date(state.date+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})):'The delivery estimate comes from your retailer.'}</div></div><ol class="timeline"><li><span class="dot">${icon(state.accepted?'check':'clock')}</span><div><strong>${state.accepted?'Offer accepted':'Recipient confirmation pending'}</strong><p>${state.accepted?'Delivery address confirmed and shared.':'The donor has not received a delivery address.'}</p></div></li><li><span class="dot ${state.ordered?'':'pending'}">${icon(state.ordered?'check':'clock')}</span><div><strong>${state.ordered?'Order confirmation shared':'Order confirmation pending'}</strong><p>${state.ordered?esc(state.store)+' · '+esc(state.order):'Order details will be shared after purchase.'}</p></div></li><li><span class="dot pending">${icon('truck')}</span><div><strong>Delivery to the recipient</strong><p>Use the retailer’s tracking for courier updates.</p></div></li><li><span class="dot pending">${icon('heart')}</span><div><strong>Recipient confirms receipt</strong><p>This is what completes the donation.</p></div></li></ol>${state.tracking?`<a class="btn secondary wide" href="${esc(state.tracking)}" target="_blank" rel="noopener noreferrer">Open retailer tracking ↗</a>`:''}<div class="actions"><button class="text-btn" data-go="2">${state.ordered?'Edit order details':'Add order details'}</button><button class="btn" data-go="4" ${state.ordered?'':'disabled'}>Preview recipient confirmation${icon('arrow')}</button></div></section>${aside()}</div>`;}
    function receipt(){if(state.received)return heading('A PROMISE KEPT','One less thing to worry about.','The recipient has confirmed the item arrived and matches their request.')+`<div class="layout"><section class="card success"><div class="success-mark">${icon('heart')}</div><h2>Thank you for showing up.</h2><p>A new school bag is now ready for a new school day. This donation is complete.</p><span class="badge green">${icon('check')}Receipt confirmed by recipient</span><div class="issue"><p class="sub">Design preview complete. No real donation was created.</p><button class="text-btn" data-action="restart">Explore the flow again</button></div></section>${aside()}</div>`;return heading('YOUR DELIVERY','Has your new item arrived?','Confirm only after you’ve received the parcel and checked what’s inside.','Donee view')+`<div class="layout"><section class="card">${summary()}${!state.ordered?`<div class="callout">${icon('clock')}<div><strong>Waiting for an order update</strong>The donor hasn’t shared the order confirmation yet.</div></div><button class="btn wide" style="margin-top:20px" data-go="2">Preview the order step${icon('arrow')}</button>`:`<div class="callout">${icon('shield')}<div><strong>Your confirmation matters</strong>A retailer marking the parcel delivered won’t complete your donation automatically.</div></div><label class="consent" style="margin-top:24px"><input type="checkbox" id="received-check" ${state.deliveryOkay?'checked':''}><span>I have received the item, checked it, and it matches the item I accepted.</span></label><button class="btn wide" id="confirm-receipt" data-action="received" style="margin-top:20px" ${state.deliveryOkay?'':'disabled'}>Confirm received${icon('check')}</button><p class="fine">No CauseKind handover OTP is requested for this proposed retailer-delivery flow.</p><div class="issue"><p class="sub">Wrong item, damaged parcel, or not delivered?</p><button class="text-btn" data-action="problem">Report a delivery issue</button></div>`}</section>${aside()}</div>`;}
    function render(focus=false){const donee=state.screen===1||state.screen===4;document.getElementById('shell').dataset.role=donee?'donee':'donor';document.getElementById('role-label').textContent=donee?'Donee view':'Donor view';document.getElementById('avatar').textContent=donee?'R':'D';document.getElementById('screen-nav').innerHTML=labels.map((l,i)=>`<button data-go="${i}" ${state.screen===i?'aria-current="step"':''}><b>${i+1}</b>${l}</button>`).join('');document.getElementById('content').innerHTML=[donorOffer,doneeAddress,placeOrder,tracking,receipt][state.screen]();if(state.notice){const p=document.createElement('p');p.className='notice';p.setAttribute('role','status');p.textContent=state.notice;document.getElementById('content').prepend(p);}if(focus)document.getElementById('screen-heading')?.focus({preventScroll:true});}
    function go(i){state.screen=i;state.notice='';render(true);document.getElementById('shell').scrollIntoView({block:'start',behavior:'instant'});}
    function safeLink(value){if(!value)return true;try{return new URL(value).protocol==='https:';}catch{return false;}}
    function readForm(form,keys){const data=new FormData(form);for(const k of keys)if(data.has(k))state[k]=String(data.get(k)).trim();}
    document.addEventListener('submit',e=>{const form=e.target;if(!['proposal-form','address-form','order-form','message-form'].includes(form.id))return;e.preventDefault();if(form.id==='proposal-form'){readForm(form,['item','link','timeline','notes']);if(!safeLink(state.link)){document.getElementById('link').setCustomValidity('Please use a secure https:// product link.');document.getElementById('link').reportValidity();return;}state.sent=true;render(true);}else if(form.id==='address-form'){if(!state.consent)return;readForm(form,['name','phone','line','area','city','state','pin']);state.accepted=true;state.sent=true;state.editing=false;go(2);}else if(form.id==='order-form'){if(!state.accepted)return;readForm(form,['store','order','date','tracking']);if(!safeLink(state.tracking)){document.getElementById('tracking').setCustomValidity('Please use an https:// tracking link.');document.getElementById('tracking').reportValidity();return;}state.ordered=true;go(3);}else{document.getElementById('message-dialog').close();state.notice='Preview: this is where your message would be sent. Nothing was sent.';render(true);}});
    document.addEventListener('input',e=>{if(e.target.id==='link'||e.target.id==='tracking')e.target.setCustomValidity('');});
    document.addEventListener('change',e=>{if(e.target.id==='consent'){state.consent=e.target.checked;document.getElementById('accept').disabled=!state.consent;}if(e.target.id==='received-check'){state.deliveryOkay=e.target.checked;document.getElementById('confirm-receipt').disabled=!state.deliveryOkay;}if(e.target.id==='proof'){state.attachment=e.target.files[0]?.name||'';document.getElementById('file-label').textContent=state.attachment||'Choose a screenshot or PDF';}});
    document.addEventListener('click',async e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.go!==undefined){go(Number(target.dataset.go));return;}const action=target.dataset.action;if(action==='edit-address'){state.editing=!state.editing;render();}if(action==='edit-offer'){state.sent=false;render();}if(action==='copy'){try{await navigator.clipboard.writeText([state.name,state.line,state.area,state.city+', '+state.state+' '+state.pin,'Phone: '+state.phone].join('\n'));document.getElementById('copy-status').textContent='Delivery details copied.';}catch{document.getElementById('copy-status').textContent='Copy is unavailable here. Select the address text to copy it.';}}if(action==='change'||action==='problem'){document.getElementById('dialog-title').textContent=action==='problem'?'Report a delivery issue':'Ask for a change';document.getElementById('dialog-intro').textContent=action==='problem'?'Tell us what happened. Don’t confirm receipt while there’s an unresolved problem.':'Let the donor know what would work better.';document.getElementById('message').value='';document.getElementById('message-dialog').showModal();}if(action==='received'&&state.deliveryOkay&&state.ordered){state.received=true;render(true);}if(action==='restart'||target.id==='reset'){state=fresh();render(true);}if(target.id==='close-dialog')document.getElementById('message-dialog').close();if(target.id==='size-toggle'){const on=document.getElementById('shell').classList.toggle('mobile');target.setAttribute('aria-pressed',String(on));target.textContent=on?'Desktop view':'Mobile view';}});
    render();
  </script>
</body>
</html>
